{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Check your email</h1>
  <p>Your account was created. We sent a verification link to <strong>{{ email }}</strong>. Click it to finish signing up.</p>
  <p class="muted">No email? <a href="{% url 'resend_verification' %}">Send it again</a>.</p>
</div>
{% endblock %}
