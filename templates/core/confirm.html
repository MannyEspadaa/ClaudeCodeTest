{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <form method="post">{% csrf_token %}
    <div class="actions"><button class="danger" type="submit">Delete</button>
    <a class="button secondary" href="{{ cancel_url }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
