{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow" role="alert">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'landing' %}{% endif %}">Back to safety</a>
</div>
{% endblock %}
